name: CI
on:
  # Builds run only for version tags (vX.Y.Z). Day-to-day work goes to `develop`; `main` is merged by hand.
  push:
    tags: ['v*.*.*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Generated files are up to date
        run: git diff --exit-code -- generated
      - name: C++ tests
        run: |
          cmake -S . -B build -DSTRIPLINE_PROTOCOL_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
